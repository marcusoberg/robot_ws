[project]
name = "robot-model-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["robot-inference", "lerobot[training,smolvla,feetech]==0.6.0", "torch==2.10.0", "torchvision==0.25.0", "torchcodec==0.9.1", "scipy>=1.15,<2"]

[tool.uv.sources]
robot-inference = { path = "../../inference", editable = true }

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
