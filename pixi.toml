[workspace]
name = "robot-workspace"
channels = ["conda-forge"]
# The pinned PAROL6 API ships pinokin wheels for these deployment targets.
platforms = [
    { name = "macos-15-arm64", platform = "osx-arm64", macos = "15.0" },
    { name = "linux-glibc239", platform = "linux-64", glibc = "2.39" },
]

[dependencies]
python = "3.12.*"
pip = "*"
uv = "0.13.*"
cmake = ">=3.22,<4"
ninja = "*"
compilers = "*"
numpy = ">=2,<2.5"

[pypi-dependencies]
parol6 = { git = "https://github.com/PCrnjak/PAROL6-python-API.git", rev = "6f17f41a6e8c0c828befb7830259a53b578e2b48" }
numpy = ">=2,<2.5"
mujoco = "==3.10.0"
hatchling = ">=1.27,<2"
editables = ">=0.5,<1"
pytest = ">=8,<9"
robot-description = { path = "src/robot_description", editable = true }
robot-data = { path = "src/robot_data", editable = true }
robot-server-node = { path = "src/robot_server", editable = true }
robot-teleop = { path = "src/robot_teleop", editable = true }
robot-path = { path = "src/robot_path", editable = true }
model-client = { path = "src/model_client", editable = true }
robot-core = { path = "external", editable = true }

[activation]
scripts = ["scripts/activate.sh"]

[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
setup = "python scripts/setup.py"
build = "python scripts/setup.py --build-only"
doctor = "python scripts/doctor.py"
test = "python -m pytest tests -q"
setup-models = "python scripts/manage.py setup"
dataset = "python scripts/manage.py dataset"
train = "python scripts/manage.py train"
export-model = "python scripts/manage.py export"
serve-model = "python scripts/manage.py serve"

[feature.ros]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]

[feature.ros.dependencies]
pytest = ">=8,<9"
colcon-common-extensions = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-rosgraph-msgs = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-foxglove-bridge = "*"

[feature.ros.activation]
scripts = ["scripts/activate.sh", "scripts/activate_ros.sh"]

[feature.ros.tasks]
path-preview = "python -m robot_path.preview"
path = "ros2 launch robot_path parol6_path.launch.py start_server:=false"
path-source = "ros2 launch robot_path parol6_path.launch.py start_server:=false"

home = "python -m robot_server_node.control home"
standby = "python -m robot_server_client.move_joint --standby"
pose = "python -m robot_server_client.move_joint --pose"
engage = "ros2 topic pub --once /teleop/engage std_msgs/msg/Bool '{data: true}'"
disengage = "ros2 topic pub --once /teleop/engage std_msgs/msg/Bool '{data: false}'"
record = "python -m robot_server_node.control record"
save = "python -m robot_server_node.control save"
discard = "python -m robot_server_node.control discard"
reset = "python -m robot_server_node.control reset"
pause = "python -m robot_server_node.control pause"
enable = "python -m robot_server_node.control enable"
disable = "python -m robot_server_node.control disable"
setup-ros = "python scripts/setup.py --ros"
server-ros = "ros2 launch robot_server server.launch.py backend:=simulation"
foxglove = "ros2 launch robot_server foxglove.launch.py"
visualize-parol6 = "ros2 launch robot_server visualization.launch.py robot:=parol6 backend:=serial scene:=robot_only"


viz = "ros2 launch robot_server visualization.launch.py"

teleop = "ros2 launch robot_teleop so101_so101.launch.py profile:=parol6"
calibrate-so101 = "python -m robot_teleop.calibrate"
teleop-so101 = "ros2 launch robot_teleop so101_so101.launch.py profile:=so101"
teleop-parol6 = "ros2 launch robot_teleop so101_so101.launch.py profile:=parol6"
teleop-parol6-msg-ai-100 = "ros2 launch robot_teleop so101_so101.launch.py profile:=parol6_msg_ai_100"

server = "ros2 launch robot_server server.launch.py backend:=simulation"
server-parol6-serial = "ros2 launch robot_server server.launch.py backend:=serial"
server-parol6 = "ros2 launch robot_server server.launch.py backend:=simulation"
server-parol6-msg-ai-100 = "ros2 launch robot_server server.launch.py backend:=simulation gripper:=msg_ai_100"
server-stop = "python -m robot_server_node.shutdown"

[environments]
default = { features = [] }
ros = { features = ["ros"] }
