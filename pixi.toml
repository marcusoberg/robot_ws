[workspace]
name = "robot-workspace"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]
[dependencies]
numpy = "==2.3.5"
python = "3.12.*"
pip = "*"
uv = "0.13.*"
scipy = ">=1.15,<2"
cmake = ">=3.22,<4"
ninja = "*"
yaml-cpp = "0.8.*"
compilers = "*"
colcon-common-extensions = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-rclpy = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-trajectory-msgs = "*"
ros-jazzy-tf2-msgs = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-foxglove-bridge = "*"
[activation.env]
ROS_DOMAIN_ID = "42"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
PYTHONNOUSERSITE = "1"
[activation]
scripts = ["scripts/activate.sh"]
[tasks]
setup = "python scripts/setup.py"
build = "python scripts/setup.py --build-only"
doctor = "python scripts/doctor.py"
setup-models = "python scripts/models.py setup"
model-server = "python scripts/models.py serve"
fetch-act = "python scripts/fetch_act.py"
train-model = "python scripts/models.py train"
smoke = "python scripts/smoke.py"
robotctl = "ros2 run robot_examples robotctl"
export-dataset = "python scripts/models.py export"
[pypi-dependencies]
mujoco = "==3.10.0"
nanobind = "==3.1.0"
scikit-build-core = ">=0.11,<2"
hatchling = ">=1.27,<2"
editables = ">=0.5,<1"
setuptools = ">=77"
pydantic = ">=2.10,<3"
msgpack = ">=1.1,<2"
websockets = ">=14,<17"
pillow = ">=11,<13"
mcap = ">=1.3,<2"
pyyaml = ">=6,<7"
psutil = ">=7,<8"
