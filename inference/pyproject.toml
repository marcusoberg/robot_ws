[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "robot-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "protobuf==7.36.2", "websockets>=14,<17", "pyyaml>=6,<7"]
[tool.hatch.build.targets.wheel]
packages = ["robot_inference"]
[project.scripts]
robot-model-server = "robot_inference.server:main"
