syntax = "proto3";
package robot.inference.v1;

message Identity {
  string runtime_instance = 1;
  uint64 timeline_generation = 2;
  uint64 observation_sequence = 3;
}
message CameraFeature { string name = 1; uint32 channels = 2; uint32 height = 3; uint32 width = 4; }
message Features {
  repeated string state_joints = 1;
  repeated string action_joints = 2;
  repeated string state_units = 3;
  repeated string action_units = 4;
  repeated CameraFeature cameras = 5;
  string action_representation = 6;
  double action_period = 7;
  bool instruction = 8;
  bool binary_gripper = 9;
  uint64 action_time_offset_ns = 10;
}
message Stamp {
  uint64 sequence = 1;
  uint64 epoch = 2;
  string source_clock = 3;
  optional sint64 source_time_ns = 4;
  uint64 host_received_ns = 5;
}
message Tensor {
  string name = 1;
  enum DType { UNSPECIFIED = 0; UINT8 = 1; FLOAT64_LE = 2; }
  DType dtype = 2;
  repeated uint32 shape = 3;
  bytes data = 4;
  Stamp stamp = 5;
  string frame = 6;
  string calibration = 7;
  repeated double intrinsics = 8;
  repeated double world_from_camera = 9;
}
message Input {
  Identity basis = 1;
  uint64 execution_time_ns = 2;
  repeated Tensor tensors = 3;
  string instruction = 4;
  string episode = 5;
  string context = 6;
}
message Prediction {
  Identity basis = 1;
  uint64 execution_time_ns = 2;
  string model_revision = 3;
  string action_representation = 4;
  double action_period = 5;
  uint32 steps = 6;
  uint32 dimensions = 7;
  repeated double actions = 8;
  uint64 computation_ns = 9;
}
message Hello { Features features = 1; string expected_revision = 2; }
message Ready { Features features = 1; string model_revision = 2; }
message Error { string reason = 1; }
message Envelope {
  uint32 version = 1;
  string request_id = 2;
  oneof payload {
    Hello hello = 3;
    Ready ready = 4;
    Input input = 5;
    Prediction prediction = 6;
    Error error = 7;
  }
}
