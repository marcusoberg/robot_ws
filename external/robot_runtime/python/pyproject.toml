[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "robot-runtime"
version = "0.1.0"
description = "ROS-free C++ robot runtime with direct Python bindings"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "PyYAML>=6,<7"]
[project.optional-dependencies]
render = ["mujoco==3.10.0"]
[tool.hatch.build.targets.wheel]
packages = ["robot_runtime"]
