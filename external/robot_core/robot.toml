# Workspace runtime settings. Joint angles are radians unless the key says degrees.
[hardware]
serial_port = "/dev/cu.usbmodem3074388334331"
api_host = "127.0.0.1"
api_port = 5001
connect_timeout = 30.0
home_timeout = 100.0
move_timeout_margin = 15.0
shutdown_timeout = 5.0
stopped_speed_deg_s = 0.5

[ros]
domain_id = 42
restart = false
default_backend = "simulation"
command_depth = 10
latest_depth = 1
control_poll_period = 0.1
shutdown_timeout = 10.0
cancel_home_timeout = 2.0
ownership_poll_period = 0.05

[motion]
pose_degrees = [90.0, -144.683, 108.171, 5.0, 0.0, 90.0]
duration = 4.0
endpoint_tolerance_rad = 0.001
completion_samples = 3
heartbeat_period = 0.05
status_period = 0.02
feedback_timeout = 0.5
command_history = 128
pending_commands = 32
trace_capacity = 4096
discovery_timeout = 10.0
ack_timeout = 5.0
hold_timeout = 1.0
poll_period = 0.01

[action]
period_ns = 50000000
controller = "PositionHold.v1"
semantics = "absolute_joint_position_goal"
state = "measured_joint_position"
version = 2
cameras = ["front", "top", "wrist"]
image_shape = [480, 640, 3]

[profile]
execution_period_ns = 10000000
physics_period_ns = 1000000
source_timeout_ns = 300000000
backend = "mujoco-position"
stop_velocity = 0.02
stop_settled_ns = 100000000
stop_timeout_ns = 5000000000
cube_half_size = 0.015
task = "pick_place"

[robots.so101]
assets = "so101"
description = "so101_new_calib.urdf"
scene = "scene.xml"
joints = ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
initial = [0.0, -0.3, 0.6, 1.2, 0.0, -0.1]

[robots.parol6]
assets = "deferred/parol6"
arm_initial = [0.0, -1.3, 3.4, 0.0, 0.2, 3.141592653589793]
joints = ["L1", "L2", "L3", "L4", "L5", "L6", "gripper_slide"]
gripper = "pneumatic"
cube_half_size = 0.007

[robots.parol6.pneumatic]
description = "parol6.urdf"
robot_only = "robot_only_pneumatic.xml"
pick_place = "scene.xml"
gripper_initial = 0.0035

[robots.parol6.msg_ai_100]
description = "parol6_msg_ai_100.urdf"
robot_only = "robot_only_msg_ai_100.xml"
pick_place = "scene_msg_ai_100.xml"
gripper_initial = 0.0

[ik]
max_iterations = 100
position_tolerance = 0.0001
orientation_tolerance = 0.001
damping = 0.000001
step_size = 0.1
position_scale = 1.0
orientation_scale = 1.0
posture_weight = 0.0
singularity_condition = 0.0

[visualization]
robot = "parol6"
scene = "robot_only"
publish_tf = true
publish_model = true
foxglove = false
model_period = 1.0
default_rgba = [0.75, 0.75, 0.75, 1.0]
host = "127.0.0.1"
port = 8766

# Live pose tracking uses the calibrated workspace TCP and URDF velocity limits.
[cartesian]
base = "base_link"
tip = "tool_tcp"

[cartesian.pneumatic]
position_scale = 0.1
orientation_scale = 0.1
posture_weight = 1.0
singularity_condition = 10.0

[cartesian.msg_ai_100]
position_scale = 0.001
orientation_scale = 0.01
posture_weight = 1.0
singularity_condition = 20.0
