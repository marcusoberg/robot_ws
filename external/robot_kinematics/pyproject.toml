[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "robot-kinematics"
version = "0.1.0"
description = "ROS-free URDF kinematics, bounded inverse kinematics and joint interpolation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pin>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["robot_kinematics"]
