name: Standalone and optional ROS
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S external/robot_runtime -B build/core -DBUILD_TESTING=ON && cmake --build build/core && ctest --test-dir build/core --output-on-failure
  standalone:
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.81.0
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - run: pixi run setup
      - run: xvfb-run -a pixi run test
      - run: pixi run doctor
  ros:
    needs: standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.81.0
          environments: ros
      - run: pixi run -e ros setup-ros
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - run: xvfb-run -a pixi run -e ros test-ros
