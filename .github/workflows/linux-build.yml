name: Python API and ROS interfaces
on: [push, pull_request]
jobs:
  ros:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.81.0
          environments: ros
      - run: pixi run -e ros setup-ros --build-only
      - run: pixi run -e ros doctor
      - run: pixi run -e ros python -m compileall -q src external/robot_core
