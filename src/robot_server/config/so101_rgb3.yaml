robot:
  description: ../assets/so101/so101_new_calib.urdf
  base: world
  tip: gripperframe
  auxiliary_joints:
  - gripper
  initial:
  - 0.0
  - -0.3
  - 0.6
  - 1.2
  - 0.0
  - -0.1
  standby:
  - 0.0
  - -0.3
  - 0.6
  - 1.2
  - 0.0
  - -0.1
controller:
  period_ms: 10
  standby_duration_ms: 3000
  speed_fraction: 0.5
  acceleration_time: 0.1
  jerk_time: 0.02
  position_gain: 30.0
mujoco:
  model: ../assets/so101/scene.xml
cameras:
- name: front
  width: 640
  height: 480
  depth: false
  frame: front
  calibration: so101-front-rgb3-v1
  frequency: 20
- name: top
  width: 640
  height: 480
  depth: false
  frame: top
  calibration: so101-top-rgb3-v1
  frequency: 20
- name: wrist
  width: 640
  height: 480
  depth: false
  frame: wrist
  calibration: so101-wrist-rgb3-v1
  frequency: 20
