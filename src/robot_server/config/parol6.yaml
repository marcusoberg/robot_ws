robot:
  description: ../assets/parol6/parol6.urdf
  # Cartesian commands and the robot mounting frame are aligned with world.
  base: world
  tip: tool_tcp
  # Start 0.1 degree inside L2/L3 stops: soft simulation limits allow tiny deflection.
  initial:
  - 1.5707963267948966
  - -2.529135675113959
  - 1.8843621802081978
  - 0
  - 0
  - 3.141592653589793
  standby:
  - 1.5707963267948966
  - -2.529135675113959
  - 1.8843621802081978
  - 0
  - 0
  - 3.141592653589793
controller:
  period_ms: 10
  standby_duration_ms: 4000
  speed_fraction: 0.35
  acceleration_time: 0.3333333333333333
  jerk_time: 0.1
mujoco:
  model: ../assets/parol6/scene.xml
  base_frame: world
  velocity_feedforward: true
  binary_actuator: gripper_position
  open_position: 0.0035
  closed_position: 0.0
serial:
  device: /dev/ttyACM0
  baud: 3000000
  startup_outputs:
  - false
  - false
  first_response_timeout_seconds: 1.0
  pneumatic_open_high: true
  joints:
  - L1
  - L2
  - L3
  - L4
  - L5
  - L6
cameras:
- name: front
  width: 640
  height: 480
  depth: false
  frame: front
  calibration: parol6-front-v2
  frequency: 20
