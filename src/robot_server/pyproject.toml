[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "robot-server-core"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["robot-description>=2,<3", "robot-data>=2,<3", "mujoco==3.10.0"]
[tool.hatch.build.targets.wheel]
packages = ["robot_server_core"]
