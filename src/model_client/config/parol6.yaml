# Matches robot_teleop's PAROL6 dataset. The seventh output is binary, not a joint.
model: act
joints: [L1, L2, L3, L4, L5, L6]
action_joints: [L1, L2, L3, L4, L5, L6, gripper_open]
state_units: [rad, rad, rad, rad, rad, rad]
action_units: [rad, rad, rad, rad, rad, rad, binary]
state_scale: [1, 1, 1, 1, 1, 1]
state_offset: [0, 0, 0, 0, 0, 0]
action_scale: [1, 1, 1, 1, 1, 1, 1]
action_offset: [0, 0, 0, 0, 0, 0, 0]
binary_gripper: true
gripper_threshold: 0.5
# Collection pairs observation(t) with executed reference(t + 50 ms).
action_time_offset_ns: 50000000
cameras:
  observation.images.overview: overview/rgb
resolution: [320, 240]
period: 0.05
fit_tolerance: 0.1
join_seconds: 1.0
lead_seconds: 0.15
