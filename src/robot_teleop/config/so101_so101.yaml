# Joint-to-joint leader control. FK is only used for /teleop/target preview.
control_mode: joints
mapping:
  base: base_link
  tip: gripper_frame_link
  joint_sign: [1, 1, 1, 1, 1]
  joint_offset_degrees: [0, 0, 0, 0, 0]
  position_scale: 1.0
  # SO101 follower mounting in its scene, not a rotation of the physical leader.
  robot_from_leader:
    xyz: [0.2, -0.12, 0]
    rpy: [0, 0, 1.5707963267948966]
  # Upstream virtual tool uses Ry(pi); simulator gripperframe uses Ry(pi/2).
  # This conversion affects the preview only; commands contain joint angles.
  handle_to_tool:
    xyz: [0, 0, 0]
    rpy: [0, -1.5707936732051035, 0]
gripper:
  type: joint
  joint: gripper
  closed: -0.174533
  open: 1.74533
recording:
  robot_type: so101_sim
  fps: 20
  task: Pick up the green cube and place it in the brown container.
  cameras:
    front: front/rgb
    top: top/rgb
    wrist: wrist/rgb
