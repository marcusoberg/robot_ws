[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "robot-path"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["robot-description>=2,<3", "robot-core[kinematics]>=0.1,<0.2"]
[tool.hatch.build.targets.wheel]
packages = ["robot_path"]
