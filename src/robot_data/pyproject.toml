[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "robot-data"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["robot-description>=2,<3", "numpy>=2,<3", "pillow>=11,<13"]
[tool.hatch.build.targets.wheel]
packages = ["robot_data"]
[project.scripts]
robot-data = "robot_data.cli:main"
