[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "model-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["model-api>=0.1"]
[tool.hatch.build.targets.wheel]
packages = ["model_server"]
[project.optional-dependencies]
lerobot = ["lerobot[smolvla]==0.6.0", "safetensors>=0.5,<1"]
[project.scripts]
model-server = "model_server.server:main"
