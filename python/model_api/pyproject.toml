[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "model-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pydantic>=2.10,<3", "msgpack>=1.1,<2", "websockets>=14,<17"]
[tool.hatch.build.targets.wheel]
packages = ["model_api"]
